services:
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datapilot
    ports:
      - "5432:5432"
    volumes:
      - datapilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datapilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: datapilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - datapilot_redisdata:/data
    command: redis-server --appendonly yes
volumes:
  datapilot_pgdata:
  datapilot_redisdata:
