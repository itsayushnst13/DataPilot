services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
    volumes:
      - datapilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}"]
    volumes:
      - datapilot_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datapilot}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AGENT_SERVICE_URL: http://agents:8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["4000"]
    command: sh -c "npm run db:migrate --workspace @datapilot/api && npm run start --workspace @datapilot/api"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datapilot}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AGENT_SERVICE_URL: http://agents:8000
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "apps/api/src/workers/investigation.worker.js"]
  agents:
    build:
      context: .
      dockerfile: services/agents/Dockerfile
    restart: unless-stopped
    env_file: services/agents/.env
    environment:
      API_URL: http://api:4000/api/v1/internal
    depends_on:
      api:
        condition: service_healthy
    expose: ["8000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
volumes:
  datapilot_pgdata:
  datapilot_redisdata:
