name: DataPilot CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: datapilot-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datapilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datapilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datapilot?schema=public
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
      DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_SERVICE_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/agents/requirements.txt
      - run: python -m compileall -q services/agents/app
      - run: PYTHONPATH=services/agents python -m unittest discover -s services/agents/tests
